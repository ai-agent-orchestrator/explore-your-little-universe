services:
  postgres:
    image: postgres:17.12
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: lumi
      POSTGRES_DB: lumi
      POSTGRES_PASSWORD: ${LUMI_POSTGRES_PASSWORD:?Set LUMI_POSTGRES_PASSWORD locally}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
